<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">A policy-gradient learning loop</title><desc id="desc">Policy samples actions, environment provides rewards, and the estimator updates the policy.</desc>
